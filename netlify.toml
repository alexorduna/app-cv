# Despliegue en Netlify. El Google Sheet es la base de datos (ver README, sección "En línea con Netlify").
# Netlify detecta Next.js solo; las variables secretas se ponen en el panel de Netlify, no aquí.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Búsqueda automática en Netlify (gratis en el plan Free; ver README "Búsqueda automática en Netlify").
# buscar-programada (cada 6 h, máx. 30 s) dispara buscar-background (máx. 15 min), que corre la búsqueda.
[functions."buscar-background"]
  node_bundler = "esbuild"
  external_node_modules = ["better-sqlite3"]
  included_files = ["drizzle/**"]
